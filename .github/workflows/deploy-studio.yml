name: Deploy Sanity Studio

# Deploys the Sanity Studio to alexisporcaro.sanity.studio whenever the studio
# code under sanity/ changes on main. Also runnable on demand. Requires repo
# secret SANITY_DEPLOY_TOKEN — a token with Deploy Studio (Editor) rights.
# The Viewer token used for backups cannot deploy.

on:
  push:
    branches: [main]
    paths:
      - "sanity/**"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: deploy-studio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sanity/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: npx sanity deploy
